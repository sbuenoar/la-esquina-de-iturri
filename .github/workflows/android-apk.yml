name: Compilar APK - La Esquina de Iturri

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: La-Esquina-de-Iturri-APK-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
